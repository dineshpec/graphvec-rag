name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    # Dummy placeholder values so pydantic-settings validation in
    # backend/config.py succeeds at import time without any real
    # credentials or network calls. Tests mock Neo4j/OpenAI (see
    # tests/conftest.py), so these values are never used to reach a
    # real service.
    env:
      OPENAI_API_KEY: sk-test-ci-placeholder-key
      NEO4J_URI: neo4j+s://ci-placeholder.databases.neo4j.io
      NEO4J_USERNAME: ci-test-user
      NEO4J_PASSWORD: ci-test-password
      API_KEY: ci-test-api-key
      ENVIRONMENT: test

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            backend/requirements.txt
            frontend/requirements.txt

      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt

      - name: Install frontend dependencies
        run: pip install -r frontend/requirements.txt

      - name: Lint (syntax check via py_compile)
        run: |
          python -m py_compile backend/*.py
          python -m py_compile frontend/*.py

      - name: Run tests
        run: pytest tests/ -v
