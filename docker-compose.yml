# Modern Docker Compose (Compose V2, bundled with current Docker Desktop /
# docker-compose-plugin) no longer requires the top-level `version:` key, so
# it is intentionally omitted here for forward compatibility. If you need to
# run this file with a much older standalone docker-compose (<1.27), add
# `version: "3.9"` back at the top.

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: hybrid-rag-backend
    env_file:
      - .env
    # No `ports:` mapping: the backend is only reachable from other
    # containers on the internal Compose network (e.g. by `frontend`, via
    # BACKEND_URL=http://backend:8000 below). It is intentionally not
    # exposed directly to the host/internet — only Caddy's 80/443 are
    # public. If you need to call the API directly (e.g. via curl/Postman)
    # while developing, temporarily add back `ports: ["8000:8000"]`.
    volumes:
      # Directory-level bind mount persists both the FAISS vector index and
      # the SQLite document-tracking DB (backend/faiss_index/doc_store.sqlite3).
      # Directory mounts are safe even if the host folder is empty/missing;
      # file-level bind mounts are not (Docker would silently create a
      # directory instead of a file), so avoid mounting doc_store.sqlite3
      # directly.
      - ./backend/faiss_index:/app/backend/faiss_index
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    image: hybrid-rag-frontend
    depends_on:
      backend:
        condition: service_healthy
    environment:
      BACKEND_URL: http://backend:8000
    # No `ports:` mapping either: only Caddy is exposed publicly and it
    # reverse-proxies to `frontend:8501` over the internal network (see
    # Caddyfile). This avoids Streamlit ever being reachable over plain
    # HTTP/without TLS.
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:

